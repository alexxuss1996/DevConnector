name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run check-types

      - run: pnpm run build

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `test:unit` runs `node --env-file=.env`, and `.env` is gitignored so
      # a fresh clone has none. The committed `.env.test` carries all seven
      # vars the env validator requires, with localhost/dummy values the unit
      # tests never reach — the suite stubs Mongo, OAuth and the session store.
      # Proper fix: repoint `test:unit` at `.env.test` and drop this step.
      - run: cp apps/api/.env.test apps/api/.env

      # `pnpm test` is `turbo run test`: api runs unit + integration (the
      # latter boots the mongo:7.0 container via test/bin/mongo-docker.sh),
      # web runs Vitest. GitHub runners have Docker, so both run here.
      - run: pnpm run test

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
